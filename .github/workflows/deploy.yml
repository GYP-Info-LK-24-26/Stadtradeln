name: Deploy website

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to FTP
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: w020601f.kasserver.com
          username: w020601f
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps        # FTP über TLS (Port 21): Passwort und Dateien verschlüsselt
          security: strict      # Zertifikat des Servers prüfen
          server-dir: ./stadtradeln.gymnasium-penzberg.de/
